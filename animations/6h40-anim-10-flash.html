<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 · Flash de variation</title>
<style>
  :root { --bg:#F4F1E9; --ink:#2A2A2A; --up:#2E6B4F; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="clair"]) { --bg:#1B1B19; --ink:#EDEAE2; --up:#7FC4A0; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; padding:16px; box-sizing:border-box; }
  .flash { padding:18px 22px; border-radius:8px; font-size:18px; animation:flash 1.2s ease 2; }
  .up { color:var(--up); }
  @keyframes flash { 0%,100% { background:transparent; } 40% { background:color-mix(in srgb, var(--up) 22%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .flash { animation:none; } }
</style>
</head>
<body>
<div class="flash">Dollar · <span class="up">+0,0063</span></div>
</body>
</html>
